<style id="acFixStyle">
#preview.acZoom{overflow:auto!important;touch-action:none;-webkit-overflow-scrolling:touch}
.acZoomBar{display:flex;justify-content:center;align-items:center;gap:8px;margin:9px 0;flex-wrap:wrap}
.acZoomBar button{min-width:44px!important;min-height:40px!important;border-radius:12px!important;font-weight:900}
.acZoomBar span{min-width:55px;text-align:center;color:#9aa6bf;font-size:11px;font-weight:800}
.acZoomTarget{transform-origin:top left;will-change:transform}
</style>
<script id="acFixScript">
(function(){
  "use strict";
  var z=1,sd=0,sz=1,px=0,py=0,lx=0,ly=0,lastTap=0;
  function result(){return window.__acResult?window.__acResult():null;}
  function target(){var p=document.getElementById("preview");return p?p.querySelector(".acZoomTarget"):null;}
  function apply(){
    var p=document.getElementById("preview"),t=target();
    if(!p||!t)return;
    t.style.transform="translate("+px+"px,"+py+"px) scale("+z+")";
    var v=document.getElementById("acZoomValue");
    if(v)v.textContent=Math.round(z*100)+"%";
  }
  function setZoom(v){z=Math.max(1,Math.min(4,v));if(z===1){px=0;py=0;}apply();}
  function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  function ensureZoomTarget(){
    var p=document.getElementById("preview");
    if(!p)return;
    var t=p.querySelector(".acZoomTarget");
    if(!t){
      t=p.querySelector("img,.pdf-preview,.pdf-page,.preview-text,.html-preview,iframe");
      if(!t)t=p.firstElementChild;
      if(t)t.classList.add("acZoomTarget");
    }
    if(t&&!p.classList.contains("acZoom"))p.classList.add("acZoom");
    if(t&&!document.getElementById("acZoomBar")){
      var b=document.createElement("div");
      b.id="acZoomBar";b.className="acZoomBar";
      b.innerHTML='<button type="button" id="acZoomOut">−</button><span id="acZoomValue">100%</span><button type="button" id="acZoomReset">100%</button><button type="button" id="acZoomIn">+</button>';
      p.parentNode.insertBefore(b,p.nextSibling);
      document.getElementById("acZoomOut").onclick=function(){setZoom(z-.25);};
      document.getElementById("acZoomIn").onclick=function(){setZoom(z+.25);};
      document.getElementById("acZoomReset").onclick=function(){z=1;px=py=0;apply();};
      apply();
    }
  }
  function watch(){
    var p=document.getElementById("preview");
    if(!p||p.dataset.acfix)return;
    p.dataset.acfix="1";
    var mo=new MutationObserver(function(){ensureZoomTarget();});
    mo.observe(p,{childList:true,subtree:true});
    p.addEventListener("dblclick",function(e){e.preventDefault();setZoom(z>1?1:2);},false);
    p.addEventListener("touchstart",function(e){
      if(e.touches.length===2){sd=distance(e.touches[0],e.touches[1]);sz=z;e.preventDefault();}
      else if(e.touches.length===1&&z>1){lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
    },{passive:false});
    p.addEventListener("touchmove",function(e){
      if(e.touches.length===2&&sd){setZoom(sz*distance(e.touches[0],e.touches[1])/sd);e.preventDefault();}
      else if(e.touches.length===1&&z>1){px+=e.touches[0].clientX-lx;py+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;apply();e.preventDefault();}
    },{passive:false});
    p.addEventListener("touchend",function(){sd=0;},{passive:false});
    p.addEventListener("click",function(e){
      var now=Date.now();
      if(now-lastTap<320){e.preventDefault();setZoom(z>1?1:2);}
      lastTap=now;
    },false);
    ensureZoomTarget();
  }
  function nativeAction(id){
    var bridge=window.AndroidFileBridge;if(!bridge)return false;
    var x=result();
    if(!x||!x.blob){showToastSafe("Tiada hasil conversion","Buat conversion dahulu.");return true;}
    var m=id==="downloadBtn"?"download":id==="saveBtn"?"save":id==="shareBtn"?"share":"open";
    var f=new FileReader();
    f.onerror=function(){showToastSafe("Gagal","Fail hasil tidak dapat dibaca.");};
    f.onload=function(){
      var d=String(f.result||"").split(",")[1]||"";
      try{
        bridge.beginResult(m,x.name||"converted-file",x.blob.type||"application/octet-stream");
        for(var i=0;i<d.length;i+=262144)bridge.writeResultChunk(d.slice(i,i+262144));
        bridge.finishResult();
      }catch(q){showToastSafe("Operasi gagal",String(q&&q.message||q));}
    };
    f.readAsDataURL(x.blob);
    return true;
  }
  function showToastSafe(a,b){
    if(typeof window.showToast==="function")window.showToast(a,b);
    else alert(a+(b?"\n"+b:""));
  }
  function bind(){
    document.addEventListener("click",function(ev){
      var e=ev.target&&ev.target.closest?ev.target.closest("#downloadBtn,#saveBtn,#shareBtn,#openBtn"):null;
      if(!e||!window.AndroidFileBridge)return;
      ev.preventDefault();ev.stopImmediatePropagation();nativeAction(e.id);
    },true);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){watch();bind();});
  else {watch();bind();}
  var timer=setInterval(function(){watch();ensureZoomTarget();},250);
  setTimeout(function(){clearInterval(timer);},30000);
})();
</script>
