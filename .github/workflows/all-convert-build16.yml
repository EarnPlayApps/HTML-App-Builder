name: All Convert APK #17
on: [push, workflow_dispatch]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Build
        run: |
          set -euo pipefail
          rm -rf app; mkdir -p app/www; cp Index.html app/www/index.html; [ -d www-source ] && cp -R www-source/. app/www/ || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/www/index.html');s=p.read_text()
          patch=r'''<style>.ac-zoombar{display:flex;justify-content:center;gap:8px;margin:10px 0}.ac-zoombar button{min-width:42px!important;min-height:40px!important;border-radius:12px!important;font-weight:900}.ac-zoombar span{min-width:58px;text-align:center;color:#9aa6bf;font-size:11px;font-weight:800}#preview.ac-zoom{overflow:auto!important;touch-action:pan-x pan-y}#preview.ac-zoom img,#preview.ac-zoom iframe,#preview.ac-zoom .preview-text,#preview.ac-zoom .html-preview{transform-origin:top left}</style><script id="acNativeResultBridge">(function(){function z(){var p=document.getElementById('preview');if(!p||document.getElementById('acZoomBar'))return;var b=document.createElement('div');b.id='acZoomBar';b.className='ac-zoombar';b.innerHTML='<button type="button" id="acZoomOut">−</button><span id="acZoomValue">100%</span><button type="button" id="acZoomReset">100%</button><button type="button" id="acZoomIn">+</button>';p.parentNode.insertBefore(b,p.nextSibling);p.classList.add('ac-zoom');var q=1;function a(){var c=p.firstElementChild;if(!c)return;c.style.transform='scale('+q+')';if(c.tagName==='IMG'||c.tagName==='IFRAME')c.style.width=(100/q)+'%';document.getElementById('acZoomValue').textContent=Math.round(q*100)+'%'}function s(v){q=Math.max(.5,Math.min(3,v));a()}document.getElementById('acZoomOut').onclick=function(){s(q-.25)};document.getElementById('acZoomIn').onclick=function(){s(q+.25)};document.getElementById('acZoomReset').onclick=function(){s(1)};new MutationObserver(function(){if(p.firstElementChild)s(1)}).observe(p,{childList:true,subtree:true})}function n(){if(!window.AndroidFileBridge)return;['downloadBtn','saveBtn','shareBtn','openBtn'].forEach(function(id){var e=document.getElementById(id);if(!e||e.dataset.nativeFixed)return;e.dataset.nativeFixed='1';e.addEventListener('click',function(x){x.preventDefault();x.stopImmediatePropagation();var blob=window.resultBlob;if(!blob){if(window.showToast)showToast('Tiada fail','Hasil conversion belum tersedia.');return}var r=new FileReader(),name=window.resultName||'converted-file',mode=id==='downloadBtn'?'download':id==='saveBtn'?'save':id==='shareBtn'?'share':'open';r.onload=function(){var d=String(r.result||'').split(',')[1]||'';AndroidFileBridge.beginResult(mode,name,blob.type||'application/octet-stream');for(var i=0;i<d.length;i+=700000)AndroidFileBridge.writeResultChunk(d.slice(i,i+700000));AndroidFileBridge.finishResult()};r.readAsDataURL(blob)},true)})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',z);else z();var t=setInterval(n,100);setTimeout(function(){clearInterval(t)},6000)})();</script>'''
          if 'acNativeResultBridge' not in s:s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
          cat > app/package.json <<'JSON'
          {"name":"all-convert-apk","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"8.0.0","@capacitor/android":"8.0.0"},"devDependencies":{"@capacitor/cli":"8.0.0"}}
          JSON
          cd app && npm install && npx cap init "All Convert" "com.apkstudio.allconvert" --web-dir www && npx cap add android && npx cap sync android && cd android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle');t=p.read_text();
          if 'play-services-ads:25.4.0' not in t:t=t.replace('dependencies {','dependencies {\n implementation \'com.google.android.gms:play-services-ads:25.4.0\'',1)
          p.write_text(t)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text()
          if 'APPLICATION_ID' not in s:
            i=s.find('>',s.find('<application'));s=s[:i+1]+'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9940728659432865~7835018675"/>'+s[i+1:]
          if 'androidx.core.content.FileProvider' not in s:
            i=s.rfind('</application>');s=s[:i]+'<provider android:name="androidx.core.content.FileProvider" android:authorities="com.apkstudio.allconvert.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>'+s[i:]
          m.write_text(s)
          x=Path('app/src/main/res/xml');x.mkdir(parents=True,exist_ok=True);(x/'file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="shared" path="."/></paths>')
          a=Path('app/src/main/java/com/apkstudio/allconvert/MainActivity.java');a.parent.mkdir(parents=True,exist_ok=True);a.write_text('''package com.apkstudio.allconvert;\nimport android.content.*;import android.net.Uri;import android.os.*;import android.provider.MediaStore;import android.util.Base64;import android.webkit.JavascriptInterface;import android.webkit.WebView;import android.view.ViewGroup;import android.widget.LinearLayout;import com.getcapacitor.BridgeActivity;import com.google.android.gms.ads.*;import androidx.core.content.FileProvider;import java.io.*;\npublic class MainActivity extends BridgeActivity{File f;FileOutputStream o;String mode,name,mime;@Override public void onCreate(Bundle b){super.onCreate(b);MobileAds.initialize(this,s->{});WebView w=getBridge().getWebView();w.getSettings().setDomStorageEnabled(true);w.addJavascriptInterface(new B(),"AndroidFileBridge");ViewGroup old=(ViewGroup)w.getParent();if(old!=null)old.removeView(w);LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.addView(w,new LinearLayout.LayoutParams(-1,0,1));AdView ad=new AdView(this);ad.setAdUnitId("ca-app-pub-9940728659432865/7572128943");int ww=(int)(getResources().getDisplayMetrics().widthPixels/getResources().getDisplayMetrics().density);ad.setAdSize(AdSize.getCurrentOrientationAnchoredAdaptiveBannerAdSize(this,ww));r.addView(ad,new LinearLayout.LayoutParams(-1,-2));setContentView(r);ad.loadAd(new AdRequest.Builder().build());}\nclass B{@JavascriptInterface public synchronized void beginResult(String m,String n,String mm)throws Exception{mode=m;name=(n==null?"converted-file":n).replaceAll("[\\\\/:*?\\\"<>|]","_");mime=(mm==null||mm.isEmpty())?"application/octet-stream":mm;f=new File(getCacheDir(),"result_"+System.currentTimeMillis());o=new FileOutputStream(f);}@JavascriptInterface public synchronized void writeResultChunk(String b)throws Exception{if(o!=null)o.write(Base64.decode(b,Base64.DEFAULT));}@JavascriptInterface public synchronized void finishResult()throws Exception{if(o!=null){o.flush();o.close();o=null;}if("download".equals(mode)||"save".equals(mode))save();else open();}void save()throws Exception{ContentValues v=new ContentValues();v.put(MediaStore.Downloads.DISPLAY_NAME,name);v.put(MediaStore.Downloads.MIME_TYPE,mime);v.put(MediaStore.Downloads.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS);v.put(MediaStore.Downloads.IS_PENDING,1);Uri u=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,v);if(u==null)throw new Exception("Save gagal");try(InputStream in=new FileInputStream(f);OutputStream out=getContentResolver().openOutputStream(u)){byte[] b=new byte[65536];int n;while((n=in.read(b))>0)out.write(b,0,n);}v.clear();v.put(MediaStore.Downloads.IS_PENDING,0);getContentResolver().update(u,v,null,null);f.delete();toast("Disimpan dalam Downloads");}void open()throws Exception{Uri u=FileProvider.getUriForFile(MainActivity.this,"com.apkstudio.allconvert.fileprovider",f);Intent i=new Intent("share".equals(mode)?Intent.ACTION_SEND:Intent.ACTION_VIEW);if("share".equals(mode)){i.setType(mime);i.putExtra(Intent.EXTRA_STREAM,u);}else i.setDataAndType(u,mime);i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);startActivity(Intent.createChooser(i,"Buka dengan"));}void toast(String s){runOnUiThread(()->android.widget.Toast.makeText(MainActivity.this,s,android.widget.Toast.LENGTH_SHORT).show());}}}\n''')
          PY
          chmod +x gradlew && ./gradlew clean assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find app/android -type f -path '*/build/outputs/apk/debug/*.apk' | head -1); test -n "$APK"; cp "$APK" app-debug.apk; sha256sum app-debug.apk > apk.sha256; unzip -t app-debug.apk >/dev/null; APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1); "$APKSIGNER" verify --verbose app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: All-Convert-APK-build-17
          path: |
            app-debug.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14
