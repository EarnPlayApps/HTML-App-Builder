name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create web project
        shell: bash
        run: |
          set -e

          mkdir -p app/www

          if [ -f "Index.html" ]; then
            cp "Index.html" "app/www/index.html"
          elif [ -f "index.html" ]; then
            cp "index.html" "app/www/index.html"
          else
            echo "ERROR: Index.html tidak dijumpai."
            exit 1
          fi

          echo "HTML app copied successfully."

      - name: Install Capacitor
        working-directory: app
        shell: bash
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

      - name: Initialize Capacitor
        working-directory: app
        shell: bash
        run: |
          set -e

          npx cap init \
            "HTML App Builder" \
            "com.earnplayapps.htmlappbuilder" \
            --web-dir www

      - name: Add Android platform
        working-directory: app
        shell: bash
        run: |
          set -e

          npx cap add android

      - name: Sync Android
        working-directory: app
        shell: bash
        run: |
          set -e

          npx cap sync android

      - name: Build Debug APK
        working-directory: app/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak berjaya dihasilkan."
            exit 1
          fi

          echo "APK berjaya dihasilkan:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Builder-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
