name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create Capacitor project
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html

          cd app

          npm init -y

          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "HTML App" "com.htmlapp.builder" --web-dir www

          npx cap add android

      - name: Copy web files
        run: |
          cd app
          npx cap copy android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: html-app-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
