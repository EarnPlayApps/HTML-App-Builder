name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: 21

      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app/www

          cp Index.html app/www/index.html

          if [ -d assets ]; then
            cp -R assets app/www/
          fi

          cd app

          npm init -y

          npm install --save-exact \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor-community/admob@8.1.0

          npx cap init \
            "HTML App Builder" \
            "com.htmlapp.builder" \
            --web-dir www

          npx cap add android

      - name: Configure AdMob
        shell: bash
        run: |
          set -e

          cd app

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/admob.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="admob_app_id">ca-app-pub-9940728659432865~9994566162</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          meta = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />"""

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace(
                  "</application>",
                  meta + "\n    </application>",
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          cd app
          npx cap sync android

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f app/android/gradlew
          test -f app/android/settings.gradle
          test -f app/android/app/build.gradle

          echo "Android project OK"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd app/android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Builder-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
