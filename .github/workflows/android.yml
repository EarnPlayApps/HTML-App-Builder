name: Build Android APK

on:
  workflow_dispatch:
  

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check Index.html
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Index.html" ]; then
            echo "ERROR: Index.html tidak ditemui."
            exit 1
          fi

          echo "Index.html OK"
          ls -lh Index.html

      - name: Create Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app

          mkdir -p app/www

          cp "Index.html" "app/www/index.html"

          cat > app/package.json <<'EOF'
          {
            "name": "html-app-builder",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo no-web-build"
            },
            "dependencies": {
              "@capacitor/core": "8.0.0",
              "@capacitor/android": "8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.0.0"
            }
          }
          EOF

      - name: Install Capacitor
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Initialize Capacitor
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          npx cap init \
            "HTML App Builder" \
            "com.earnplayapps.htmlappbuilder" \
            --web-dir www

      - name: Add Android
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

      - name: Configure Android SDK safely
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("variables.gradle")

          if variables.exists():
              text = variables.read_text(encoding="utf-8")

              text = re.sub(
                  r'minSdkVersion\s*=\s*\d+',
                  'minSdkVersion = 24',
                  text
              )

              text = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 36',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 36',
                  text
              )

              variables.write_text(text, encoding="utf-8")

          print("Android SDK:")
          print("minSdkVersion = 24")
          print("compileSdkVersion = 36")
          print("targetSdkVersion = 36")
          PY

      - name: Verify Gradle files
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper OK"

          if [ -f variables.gradle ]; then
            echo "===== variables.gradle ====="
            cat variables.gradle
            echo "============================"
          fi

      - name: Sync Capacitor
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Build APK
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak dihasilkan."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK kosong."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "       APK BERJAYA DIHASILKAN"
          echo "======================================"
          echo ""

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Builder-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
