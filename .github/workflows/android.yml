name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check source HTML
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Index.html" ]; then
            echo "ERROR: Index.html tidak ditemui."
            exit 1
          fi

          echo "Index.html ditemui."
          ls -lh Index.html

      - name: Create Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          mkdir -p app/www

          cp "Index.html" "app/www/index.html"

          cat > app/package.json <<'EOF'
          {
            "name": "html-app-builder",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web build not required"
            },
            "dependencies": {
              "@capacitor/core": "8.0.0",
              "@capacitor/android": "8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.0.0"
            }
          }
          EOF

      - name: Install npm packages
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Initialize Capacitor
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          npx cap init \
            "HTML App Builder" \
            "com.earnplayapps.htmlappbuilder" \
            --web-dir www

      - name: Create Android platform
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -d "app/android"
          test -f "app/android/gradlew"
          test -f "app/android/gradle/wrapper/gradle-wrapper.properties"

          echo "Android project dan Gradle wrapper OK."

      - name: Configure Android SDK
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("*.gradle"))
          files += list(Path(".").rglob("*.gradle.kts"))

          for path in files:
              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r'minSdk(?:Version)?\s*(?:=)?\s*\d+',
                  'minSdk 23',
                  text
              )

              text = re.sub(
                  r'targetSdk(?:Version)?\s*(?:=)?\s*\d+',
                  'targetSdk 35',
                  text
              )

              text = re.sub(
                  r'compileSdk(?:Version)?\s*(?:=)?\s*\d+',
                  'compileSdk 35',
                  text
              )

              path.write_text(text, encoding="utf-8")

          for path in files:
              text = path.read_text(encoding="utf-8")

              if re.search(
                  r'minSdk(?:Version)?\s*(?:=)?\s*8\b',
                  text,
                  re.IGNORECASE
              ):
                  raise SystemExit(
                      f"ERROR: API 8 masih wujud dalam {path}"
                  )

          print("minSdk = 23")
          print("compileSdk = 35")
          print("targetSdk = 35")
          print("SDK configuration OK.")
          PY

      - name: Sync Capacitor
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak berjaya dihasilkan."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK kosong."
            exit 1
          fi

          echo "========================================"
          echo "APK BERJAYA DIHASILKAN"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Builder-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
