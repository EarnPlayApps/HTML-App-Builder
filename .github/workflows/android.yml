name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app/www

          cp Index.html app/www/index.html

          cd app

          npm init -y

          npm install --save-exact \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

          npx cap init "HTML App Builder" "com.htmlapp.builder" --web-dir www

          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          cd app
          npx cap sync android

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "Android project OK"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd app/android

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-App-Builder-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
