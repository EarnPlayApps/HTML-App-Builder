name: All Convert APK Debug Fix

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app/www/vendor
          git cat-file blob c4681148d40d7c86763cd03edc786c1d4efb0eec > app/www/index.html
          [ -d www-source ] && cp -R www-source/. app/www/ || true
          curl -fsSL https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js -o app/www/vendor/jspdf.umd.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js -o app/www/vendor/html2canvas.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js -o app/www/vendor/mammoth.browser.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js -o app/www/vendor/jszip.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js -o app/www/vendor/tesseract.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs -o app/www/vendor/pdf.mjs
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs -o app/www/vendor/pdf.worker.mjs
          cp native-bridge/ac-fix.html app/ac-fix.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/www/index.html'); s=p.read_text()
          reps={
            'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js':'vendor/jspdf.umd.min.js',
            'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js':'vendor/html2canvas.min.js',
            'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js':'vendor/mammoth.browser.min.js',
            'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js':'vendor/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js':'vendor/tesseract.min.js',
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs':'vendor/pdf.mjs',
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs':'vendor/pdf.worker.mjs'}
          for a,b in reps.items(): s=s.replace(a,b)
          old='let currentFile=null,resultBlob=null,resultName="",previewUrl=null,toastTimer=null,extractedZipFiles=[];'
          if 'window.__acResult' not in s: s=s.replace(old,old+'window.__acResult=function(){return {blob:resultBlob,name:resultName};};',1)
          patch=Path('app/ac-fix.html').read_text()
          if 'acFixScript' not in s: s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/www/index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          if len(blocks) < 2: raise SystemExit('HTML integrity check failed: inline script blocks missing')
          for i,b in enumerate(blocks,1):
              f=Path(tempfile.gettempdir())/f'ac-script-{i}.js'; f.write_text(b)
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(f'JavaScript syntax check failed in inline script #{i}')
          opens=len(re.findall(r'<script\b',s,re.I)); closes=len(re.findall(r'</script\s*>',s,re.I))
          if opens != closes: raise SystemExit(f'HTML script tag mismatch: {opens} opens vs {closes} closes')
          print(f'HTML integrity OK: {opens} script tags, {len(blocks)} inline blocks')
          PY

      - name: Configure Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          cat > app/package.json <<'JSON'
          {"name":"all-convert-apk-debug","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"8.0.0","@capacitor/android":"8.0.0"},"devDependencies":{"@capacitor/cli":"8.0.0"}}
          JSON
          cd app
          npm install
          npx cap init "All Convert Debug" "com.apkstudio.allconvert.debug" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); t=p.read_text()
          if 'play-services-ads:25.4.0' not in t: t=t.replace('dependencies {','dependencies {\n    implementation \'com.google.android.gms:play-services-ads:25.4.0\'',1)
          p.write_text(t)
          m=Path('app/src/main/AndroidManifest.xml'); s=m.read_text()
          if 'android.permission.INTERNET' not in s:
              pos=s.find('<application'); s=s[:pos]+'<uses-permission android:name="android.permission.INTERNET" />\n'+s[pos:]
          if 'android.permission.ACCESS_NETWORK_STATE' not in s:
              pos=s.find('<application'); s=s[:pos]+'<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'+s[pos:]
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              i=s.find('>',s.find('<application')); s=s[:i+1]+'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9940728659432865~7835018675"/>'+s[i+1:]
          if 'com.apkstudio.allconvert.debug.fileprovider' not in s:
              i=s.rfind('</application>'); s=s[:i]+'<provider android:name="androidx.core.content.FileProvider" android:authorities="com.apkstudio.allconvert.debug.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>'+s[i:]
          m.write_text(s)
          x=Path('app/src/main/res/xml'); x.mkdir(parents=True,exist_ok=True)
          (x/'file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="shared" path="."/></paths>')
          for f in Path('app/src/main/java').rglob('MainActivity.java'): f.unlink()
          dst=Path('app/src/main/java/com/apkstudio/allconvert/debug/MainActivity.java'); dst.parent.mkdir(parents=True,exist_ok=True)
          src=Path('../../native-bridge/MainActivity.java')
          code=src.read_text().replace('package com.apkstudio.allconvert;','package com.apkstudio.allconvert.debug;').replace('com.apkstudio.allconvert.fileprovider','com.apkstudio.allconvert.debug.fileprovider')
          dst.write_text(code)
          PY
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/android -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)
          test -n "$APK"
          cp "$APK" All-Convert-debug-fix.apk
          sha256sum All-Convert-debug-fix.apk > All-Convert-debug-fix.sha256
          unzip -t All-Convert-debug-fix.apk >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose All-Convert-debug-fix.apk
          unzip -p All-Convert-debug-fix.apk assets/public/index.html > /tmp/final-index.html
          test -s /tmp/final-index.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('/tmp/final-index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks,1):
              f=Path(tempfile.gettempdir())/f'final-ac-script-{i}.js'; f.write_text(b)
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(f'Final APK JS syntax failed in inline script #{i}')
          if len(re.findall(r'<script\b',s,re.I)) != len(re.findall(r'</script\s*>',s,re.I)): raise SystemExit('Final APK HTML script tag mismatch')
          if 'https://cdn.jsdelivr.net/npm/pdfjs-dist' in s: raise SystemExit('Final APK still contains remote PDF.js URL')
          print('Final APK embedded HTML integrity check passed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: All-Convert-APK-debug-fix
          path: |
            All-Convert-debug-fix.apk
            All-Convert-debug-fix.sha256
          if-no-files-found: error
          retention-days: 14
