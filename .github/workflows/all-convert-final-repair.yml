name: All Convert Final Repair APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Prepare web app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app && mkdir -p app/www/vendor
          cp Index.html app/www/index.html
          curl -fsSL https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js -o app/www/vendor/jspdf.umd.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js -o app/www/vendor/html2canvas.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js -o app/www/vendor/mammoth.browser.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js -o app/www/vendor/jszip.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js -o app/www/vendor/tesseract.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs -o app/www/vendor/pdf.mjs
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs -o app/www/vendor/pdf.worker.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          p=Path('app/www/index.html'); s=p.read_text()
          for a,b in {
            'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js':'vendor/jspdf.umd.min.js',
            'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js':'vendor/html2canvas.min.js',
            'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js':'vendor/mammoth.browser.min.js',
            'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js':'vendor/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js':'vendor/tesseract.min.js'} .items(): s=s.replace(a,b)
          patch=Path('native-bridge/ac-fix.html').read_text()
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          if len(blocks)<2: raise SystemExit('script integrity failed')
          for i,b in enumerate(blocks,1):
            f=Path(tempfile.gettempdir())/f'ac-check-{i}.js'; f.write_text(b)
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode: print(r.stderr); raise SystemExit(f'JS syntax failed in inline script #{i}')
          print(f'JS syntax OK: {len(blocks)} inline scripts')
          PY
      - name: Configure Android and build
        shell: bash
        run: |
          set -euo pipefail
          cat > app/package.json <<'JSON'
          {"name":"all-convert-final-repair","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"8.0.0","@capacitor/android":"8.0.0"},"devDependencies":{"@capacitor/cli":"8.0.0"}}
          JSON
          cd app
          npm install
          npx cap init "All Convert" "com.apkstudio.allconvert.final" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); t=p.read_text(); t=t.replace('dependencies {','dependencies {\n    implementation \'com.google.android.gms:play-services-ads:25.4.0\'',1); p.write_text(t)
          m=Path('app/src/main/AndroidManifest.xml'); s=m.read_text(); pos=s.find('<application'); s=s[:pos]+'<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'+s[pos:]
          i=s.find('>',s.find('<application')); s=s[:i+1]+'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9940728659432865~7835018675"/>'+s[i+1:]
          i=s.rfind('</application>'); s=s[:i]+'<provider android:name="androidx.core.content.FileProvider" android:authorities="com.apkstudio.allconvert.final.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>'+s[i:]; m.write_text(s)
          x=Path('app/src/main/res/xml'); x.mkdir(parents=True,exist_ok=True); (x/'file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="shared" path="."/></paths>')
          for f in Path('app/src/main/java').rglob('MainActivity.java'): f.unlink()
          dst=Path('app/src/main/java/com/apkstudio/allconvert/final/MainActivity.java'); dst.parent.mkdir(parents=True,exist_ok=True)
          code=Path('../../native-bridge/MainActivity.java').read_text().replace('package com.apkstudio.allconvert;','package com.apkstudio.allconvert.final;').replace('com.apkstudio.allconvert.fileprovider','com.apkstudio.allconvert.final.fileprovider'); dst.write_text(code)
          PY
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" ../All-Convert-Final-Repair.apk
          cd ..
          sha256sum All-Convert-Final-Repair.apk > All-Convert-Final-Repair.sha256
          unzip -t All-Convert-Final-Repair.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: All-Convert-APK-Final-Repair
          path: |
            All-Convert-Final-Repair.apk
            All-Convert-Final-Repair.sha256
          if-no-files-found: error
          retention-days: 14
