name: All Convert APK #18

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app/www/vendor
          cp Index.html app/www/index.html
          [ -d www-source ] && cp -R www-source/. app/www/ || true
          curl -fsSL https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js -o app/www/vendor/jspdf.umd.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js -o app/www/vendor/html2canvas.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js -o app/www/vendor/mammoth.browser.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js -o app/www/vendor/jszip.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js -o app/www/vendor/tesseract.min.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/www/index.html')
          s=p.read_text()
          reps={
          'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js':'vendor/jspdf.umd.min.js',
          'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js':'vendor/html2canvas.min.js',
          'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js':'vendor/mammoth.browser.min.js',
          'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js':'vendor/jszip.min.js',
          'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js':'vendor/tesseract.min.js'}
          for a,b in reps.items(): s=s.replace(a,b)
          marker='window.__acResult'
          if marker not in s:
            old='let currentFile=null,resultBlob=null,resultName="",previewUrl=null,toastTimer=null,extractedZipFiles=[];'
            new=old+'window.__acResult=function(){return {blob:resultBlob,name:resultName};};'
            s=s.replace(old,new,1)
          patch='''<style id="acFixStyle">#preview.acZoom{overflow:auto!important;touch-action:none}.acZoomBar{display:flex;justify-content:center;gap:8px;margin:9px 0}.acZoomBar button{min-width:44px!important;min-height:40px!important;border-radius:12px!important;font-weight:900}.acZoomBar span{min-width:55px;text-align:center;color:#9aa6bf;font-size:11px;font-weight:800}.acZoomTarget{transform-origin:top left;will-change:transform}</style><script id="acFixScript">(function(){var z=1,sd=0,sz=1,px=0,py=0,lx=0,ly=0;function r(){return window.__acResult?window.__acResult():null}function ap(){var p=document.getElementById("preview"),t=p&&p.querySelector(".acZoomTarget");if(!t)return;t.style.transform="translate("+px+"px,"+py+"px) scale("+z+")";var v=document.getElementById("acZoomValue");if(v)v.textContent=Math.round(z*100)+"%"}function setz(v){z=Math.max(1,Math.min(4,v));ap()}function dist(a,b){var x=a.clientX-b.clientX,y=a.clientY-b.clientY;return Math.hypot(x,y)}function watch(){var p=document.getElementById("preview");if(!p||p.dataset.acfix)return;p.dataset.acfix=1;var mo=new MutationObserver(function(){var t=p.querySelector("img,.pdf-preview");if(!t||t.classList.contains("acZoomTarget"))return;p.classList.add("acZoom");t.classList.add("acZoomTarget");z=1;px=py=0;var b=document.createElement("div");b.className="acZoomBar";b.innerHTML="<button type=button id=acZoomOut>−</button><span id=acZoomValue>100%</span><button type=button id=acZoomReset>100%</button><button type=button id=acZoomIn>+</button>";p.parentNode.insertBefore(b,p.nextSibling);acZoomOut.onclick=function(){setz(z-.25)};acZoomIn.onclick=function(){setz(z+.25)};acZoomReset.onclick=function(){z=1;px=py=0;ap()};ap()});mo.observe(p,{childList:true,subtree:true});p.addEventListener("dblclick",function(){setz(z>1?1:2)});p.addEventListener("touchstart",function(e){if(e.touches.length===2){sd=dist(e.touches[0],e.touches[1]);sz=z;e.preventDefault()}else if(e.touches.length===1&&z>1){lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:false});p.addEventListener("touchmove",function(e){if(e.touches.length===2&&sd){setz(sz*dist(e.touches[0],e.touches[1])/sd);e.preventDefault()}else if(e.touches.length===1&&z>1){var dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;px+=dx;py+=dy;lx=e.touches[0].clientX;ly=e.touches[0].clientY;ap();e.preventDefault()}},{passive:false});p.addEventListener("touchend",function(){sd=0},{passive:false})}function buttons(){if(!window.AndroidFileBridge)return;["downloadBtn","saveBtn","shareBtn","openBtn"].forEach(function(id){var e=document.getElementById(id);if(!e||e.dataset.acfix)return;e.dataset.acfix=1;e.addEventListener("click",function(ev){ev.preventDefault();ev.stopImmediatePropagation();var x=r();if(!x||!x.blob){alert("Tiada hasil conversion.");return}var m=id==="downloadBtn"?"download":id==="saveBtn"?"save":id==="shareBtn"?"share":"open",f=new FileReader();f.onload=function(){var d=String(f.result).split(",")[1]||"";try{AndroidFileBridge.beginResult(m,x.name||"converted-file",x.blob.type||"application/octet-stream");for(var i=0;i<d.length;i+=400000)AndroidFileBridge.writeResultChunk(d.slice(i,i+400000));AndroidFileBridge.finishResult()}catch(q){alert("Operasi fail gagal: "+q)}};f.readAsDataURL(x.blob)},true)})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",watch);else watch();var t=setInterval(buttons,100);setTimeout(function(){clearInterval(t)},10000)})();</script>'''
          if 'acFixScript' not in s: s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
          cat > app/package.json <<'JSON'
          {"name":"all-convert-apk","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"8.0.0","@capacitor/android":"8.0.0"},"devDependencies":{"@capacitor/cli":"8.0.0"}}
          JSON
          cd app
          npm install
          npx cap init "All Convert" "com.apkstudio.allconvert" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle');t=p.read_text()
          if 'play-services-ads:25.4.0' not in t:t=t.replace('dependencies {','dependencies {\n implementation \'com.google.android.gms:play-services-ads:25.4.0\'',1)
          p.write_text(t)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
            i=s.find('>',s.find('<application'));s=s[:i+1]+'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9940728659432865~7835018675"/>'+s[i+1:]
          if 'com.apkstudio.allconvert.fileprovider' not in s:
            i=s.rfind('</application>');s=s[:i]+'<provider android:name="androidx.core.content.FileProvider" android:authorities="com.apkstudio.allconvert.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>'+s[i:]
          m.write_text(s)
          x=Path('app/src/main/res/xml');x.mkdir(parents=True,exist_ok=True);(x/'file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="shared" path="."/></paths>')
          a=Path('app/src/main/java/com/apkstudio/allconvert/MainActivity.java');a.parent.mkdir(parents=True,exist_ok=True)
          a.write_text(r'''package com.apkstudio.allconvert;
import android.content.*;import android.net.Uri;import android.os.*;import android.provider.MediaStore;import android.util.Base64;import android.webkit.JavascriptInterface;import android.webkit.WebView;import android.view.ViewGroup;import android.widget.LinearLayout;import android.widget.Toast;import com.getcapacitor.BridgeActivity;import com.google.android.gms.ads.*;import androidx.core.content.FileProvider;import java.io.*;
public class MainActivity extends BridgeActivity{private File temp;private FileOutputStream out;private String mode,name,mime;
public void onCreate(Bundle b){super.onCreate(b);MobileAds.initialize(this,s->{});WebView w=getBridge().getWebView();w.getSettings().setDomStorageEnabled(true);w.addJavascriptInterface(new B(),"AndroidFileBridge");ViewGroup old=(ViewGroup)w.getParent();if(old!=null)old.removeView(w);LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.addView(w,new LinearLayout.LayoutParams(-1,0,1f));AdView ad=new AdView(this);ad.setAdUnitId("ca-app-pub-9940728659432865/7572128943");int width=(int)(getResources().getDisplayMetrics().widthPixels/getResources().getDisplayMetrics().density);ad.setAdSize(AdSize.getCurrentOrientationAnchoredAdaptiveBannerAdSize(this,width));root.addView(ad,new LinearLayout.LayoutParams(-1,-2));setContentView(root);ad.loadAd(new AdRequest.Builder().build());}
private void say(String s){runOnUiThread(()->Toast.makeText(this,s,Toast.LENGTH_SHORT).show());}
private class B{@JavascriptInterface public synchronized void beginResult(String m,String n,String mm)throws Exception{mode=m;name=(n==null?"converted-file":n).replaceAll("[\\/:*?\"<>|]","_");mime=(mm==null||mm.isEmpty()?"application/octet-stream":mm);if(temp!=null)temp.delete();temp=new File(getCacheDir(),"allconvert_result_"+System.currentTimeMillis());out=new FileOutputStream(temp);}
@JavascriptInterface public synchronized void writeResultChunk(String b)throws Exception{if(out==null)throw new IOException("Result stream not open");out.write(Base64.decode(b,Base64.DEFAULT));}
@JavascriptInterface public synchronized void finishResult()throws Exception{if(out!=null){out.close();out=null;}if("download".equals(mode)||"save".equals(mode))save();else open();}
private void save()throws Exception{if(Build.VERSION.SDK_INT>=29){ContentValues v=new ContentValues();v.put(MediaStore.Downloads.DISPLAY_NAME,name);v.put(MediaStore.Downloads.MIME_TYPE,mime);v.put(MediaStore.Downloads.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS+"/All Convert");v.put(MediaStore.Downloads.IS_PENDING,1);Uri u=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,v);if(u==null)throw new IOException("Downloads insert gagal");try(InputStream i=new FileInputStream(temp);OutputStream o=getContentResolver().openOutputStream(u)){byte[] q=new byte[65536];int n;while((n=i.read(q))>0)o.write(q,0,n);}v.clear();v.put(MediaStore.Downloads.IS_PENDING,0);getContentResolver().update(u,v,null,null);}temp.delete();say("Fail disimpan dalam Downloads/All Convert");}
private void open()throws Exception{Uri u=FileProvider.getUriForFile(MainActivity.this,"com.apkstudio.allconvert.fileprovider",temp);Intent i="share".equals(mode)?new Intent(Intent.ACTION_SEND):new Intent(Intent.ACTION_VIEW);if("share".equals(mode)){i.setType(mime);i.putExtra(Intent.EXTRA_STREAM,u);}else{i.setDataAndType(u,mime);}i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);startActivity(Intent.createChooser(i,"Buka dengan"));}}
}
''')
          PY
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/android -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)
          test -n "$APK"
          cp "$APK" app-debug.apk
          sha256sum app-debug.apk > apk.sha256
          unzip -t app-debug.apk >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: All-Convert-APK-build-18
          path: |
            app-debug.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14
