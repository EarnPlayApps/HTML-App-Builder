name: All Convert Final Repair 2
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app/www/vendor
          cat > app/package.json <<'JSON'
          {"name":"all-convert-final-repair2","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"8.0.0","@capacitor/android":"8.0.0","jspdf":"2.5.2","html2canvas":"1.4.1","mammoth":"1.8.0","jszip":"3.10.1","tesseract.js":"5.1.1","pdfjs-dist":"4.10.38"},"devDependencies":{"@capacitor/cli":"8.0.0"}}
          JSON
          cd app
          npm install
          cp ../Index.html www/index.html
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          cp node_modules/html2canvas/dist/html2canvas.min.js www/vendor/html2canvas.min.js
          cp node_modules/mammoth/mammoth.browser.min.js www/vendor/mammoth.browser.min.js
          cp node_modules/jszip/dist/jszip.min.js www/vendor/jszip.min.js
          cp node_modules/tesseract.js/dist/tesseract.min.js www/vendor/tesseract.min.js
          cp node_modules/pdfjs-dist/build/pdf.mjs www/vendor/pdf.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs www/vendor/pdf.worker.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html'); s=p.read_text()
          for a,b in {
            'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js':'vendor/jspdf.umd.min.js',
            'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js':'vendor/html2canvas.min.js',
            'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js':'vendor/mammoth.browser.min.js',
            'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js':'vendor/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js':'vendor/tesseract.min.js'
          }.items(): s=s.replace(a,b)
          patch=Path('../native-bridge/ac-fix.html').read_text()
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
          npx cap init "All Convert" "com.apkstudio.allconvert.final2" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); t=p.read_text(); t=t.replace('dependencies {','dependencies {\n    implementation \'com.google.android.gms:play-services-ads:25.4.0\'',1); p.write_text(t)
          m=Path('app/src/main/AndroidManifest.xml'); s=m.read_text(); pos=s.find('<application'); s=s[:pos]+'<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'+s[pos:]
          i=s.find('>',s.find('<application')); s=s[:i+1]+'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9940728659432865~7835018675"/>'+s[i+1:]
          i=s.rfind('</application>'); s=s[:i]+'<provider android:name="androidx.core.content.FileProvider" android:authorities="com.apkstudio.allconvert.final2.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>'+s[i:]; m.write_text(s)
          x=Path('app/src/main/res/xml'); x.mkdir(parents=True,exist_ok=True); (x/'file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="shared" path="."/></paths>')
          for f in Path('app/src/main/java').rglob('MainActivity.java'): f.unlink()
          dst=Path('app/src/main/java/com/apkstudio/allconvert/final2/MainActivity.java'); dst.parent.mkdir(parents=True,exist_ok=True)
          code=Path('../../native-bridge/MainActivity.java').read_text().replace('package com.apkstudio.allconvert;','package com.apkstudio.allconvert.final2;').replace('com.apkstudio.allconvert.fileprovider','com.apkstudio.allconvert.final2.fileprovider'); dst.write_text(code)
          PY
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" ../../All-Convert-Final-Repair2.apk
          cd ../..
          sha256sum All-Convert-Final-Repair2.apk > All-Convert-Final-Repair2.sha256
          unzip -t All-Convert-Final-Repair2.apk >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose All-Convert-Final-Repair2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: All-Convert-APK-Final-Repair2
          path: |
            All-Convert-Final-Repair2.apk
            All-Convert-Final-Repair2.sha256
          if-no-files-found: error
          retention-days: 14
